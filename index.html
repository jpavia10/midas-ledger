<style>
:root{--bg:#0b0d12;--card:#151924;--line:#232a3a;--tx:#e8ecf4;--mut:#8a93a8;--gold:#f5c542;--good:#3ddc84;--bad:#ff5d6c;--warn:#ffb648}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 14px 40px}
h1{font-size:20px;margin:16px 0 4px;color:var(--gold)}h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mut{color:var(--mut);font-size:12px}
.big{font-size:28px;font-weight:700}.tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:#222a3b;color:var(--mut);margin:2px 2px 0 0}
.tag.STALE\?,.tag.st{background:#3a2a10;color:var(--warn)}.tag.nd{background:#3a1218;color:var(--bad)}.tag.ok{background:#10301f;color:var(--good)}.tag.hold{background:#2a2410;color:var(--gold)}
.alert{border-color:var(--bad)}.warnb{border-color:var(--warn)}
.bar{height:10px;background:#222a3b;border-radius:6px;overflow:hidden;margin-top:8px;position:relative}.bar>i{display:block;height:100%;background:var(--good)}
input,button{font:inherit;border-radius:12px;border:1px solid var(--line);background:#0f131c;color:var(--tx);padding:12px;width:100%}
button{background:var(--gold);color:#111;font-weight:700;border:0;margin-top:10px}#err{color:var(--bad);min-height:20px;margin-top:8px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:10px}summary{font-weight:600}
pre{white-space:pre-wrap;font-size:12px;color:#c9d1e3;overflow-x:auto}.ph{font-size:10px;color:var(--gold)}
#lock{max-width:420px;margin:18vh auto 0;text-align:center}
</style></head><body>

<button>Unlock</button><div id="err"></div></form></div>

async function derive(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64(P.salt),iterations:P.iter},k,{name:'AES-GCM',length:256},true,['decrypt'])}
async function dec(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));return JSON.parse(new TextDecoder().decode(pt))}
// remembered key is tied to this salt; salt changes each publish, so store password-derived raw key per salt? store PBKDF2 base via raw pw-derived bits is not reusable, so we store the raw password-derived key AND re-derive on new salt is impossible -> store key + salt; if salt changed, ask again.
async function tryRemembered(){try{const r=JSON.parse(localStorage.getItem('midasKey')||'null');if(!r||r.salt!==P.salt)return false;
const key=await crypto.subtle.importKey('raw',b64(r.k),'AES-GCM',false,['decrypt']);render(await dec(key));return true}catch(e){localStorage.removeItem('midasKey');return false}}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('err');err.textContent='Unlocking…';
try{const key=await derive(document.getElementById('pw').value);const d=await dec(key);
if(document.getElementById('rem').checked){const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));localStorage.setItem('midasKey',JSON.stringify({salt:P.salt,k:btoa(String.fromCharCode(...raw))}))}
render(d)}catch(x){err.textContent="That password didn't work. Try again 🙂"}};
const $=n=>n==null?'—':'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function tags(m){return(m||[]).map(t=>`<span class="tag ${t=='STALE?'?'st':t=='NEED YOU'?'nd':t=='HOLD'?'hold':t=='VERIFIED'?'ok':''}">${t}</span>`).join('')}
function gauge(s){const p=Math.min(1,Math.max(0,(s||0)/1000)),a=Math.PI*(1-p),x=100+80*Math.cos(a),y=100-80*Math.sin(a),c=s<400?'#3ddc84':s<550?'#ffb648':'#ff5d6c';
const g=Math.PI*(1-.4),gx=100+80*Math.cos(g),gy=100-80*Math.sin(g);
return `<svg viewBox="0 0 200 115" width="100%"><path d="M20 100A80 80 0 0 1 180 100" stroke="#232a3a" stroke-width="16" fill="none" stroke-linecap="round"/>
<path d="M20 100A80 80 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" stroke="${c}" stroke-width="16" fill="none" stroke-linecap="round"/>
<circle cx="${gx}" cy="${gy}" r="4" fill="#3ddc84"/><text x="100" y="92" text-anchor="middle" fill="#e8ecf4" font-size="34" font-weight="700">${s??'?'}</text>
<text x="100" y="110" text-anchor="middle" fill="#8a93a8" font-size="9">/1000 · lower better · goal &lt;400</text></svg>`}
function spark(h){if(!h||h.length<2)return'';const W=320,H=70,mn=Math.min(...h.map(x=>x.score),400)-10,mx=Math.max(...h.map(x=>x.score))+10;
const pt=(v,i)=>[(i/(h.length-1))*W,H-((v-mn)/(mx-mn))*H];const d=h.map((x,i)=>pt(x.score,i).map(n=>n.toFixed(1)).join(',')).join(' ');const gy=pt(400,0)[1];
return `<svg viewBox="0 0 ${W} ${H+14}" width="100%"><line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="#3ddc84" stroke-dasharray="4 4"/><polyline points="${d}" fill="none" stroke="#f5c542" stroke-width="2"/>
${h.map((x,i)=>{const[a,b]=pt(x.score,i);return`<circle cx="${a}" cy="${b}" r="2.5" fill="#f5c542"><title>${esc(x.when)}: ${x.score}</title></circle>`}).join('')}
<text x="0" y="${H+12}" fill="#8a93a8" font-size="9">${esc(h[0].when)} ${h[0].score}</text><text x="${W}" y="${H+12}" fill="#8a93a8" font-size="9" text-anchor="end">${esc(h.at(-1).when)} ${h.at(-1).score}</text></svg>`}
function cardRow(c,extra=''){const bad=c.marks.includes('NEED YOU'),st=c.marks.includes('STALE?');
return `<div class="card ${bad?'alert':st?'warnb':''}"><div class="row"><div><b>${esc(c.name)}</b> <span class="mut">${c.id}</span>${extra}</div><div class="big" style="font-size:18px">${c.balance==null?'<span class="mut">see note</span>':$(c.balance)}</div></div>
<div>${tags(c.marks)}</div><div class="mut">${esc(c.asof||'')} ${c.source!='card'?'· from '+esc(c.source):''}${c.prev!=null?' · card said '+$(c.prev):''}</div>
${c.balance==null||bad?`<div class="mut" style="margin-top:4px">${c.lines.map(esc).join('<br>')}</div>`:''}</div>`}
const ORDER={L8:[1,'Phase 1'],L6:[1,'Phase 1'],L10:[2,'Phase 2'],L4:[3,'Phase 3'],L5:[3,'Phase 3'],L9:[4,'0% autopay'],L7:[5,'Cleared'],L11:[5,'Cleared'],L13:[6,'Hold']};
function render(d){document.getElementById('lock').hidden=true;const A=document.getElementById('app');A.hidden=false;const h=d.headline,C=d.cards,by=s=>C.filter(c=>c.section==s);
const pct=Math.min(100,(h.banked||0)/(h.floor||3000)*100);
const cards=by('Cards (detail)').sort((a,b)=>(ORDER[a.id]?.[0]??9)-(ORDER[b.id]?.[0]??9));
const att=C.filter(c=>c.marks.includes('NEED YOU')||c.marks.includes('STALE?'));
A.innerHTML=`<h1>Midas Ledger</h1><div class="mut">Built ${esc(d.built_pt)} · ledger: ${esc(d.ledger_update||d.ledger_revised||'')}</div>
<div class="card">${gauge(h.stress)}${spark(d.history)}<div class="mut">${d.history.length} points · dashed line = goal 400</div></div>
<div class="card"><div class="row"><div><div class="mut">Banked liquid</div><div class="big">${$(h.banked)}</div></div><div style="text-align:right"><div class="mut">Floor</div><b>${$(h.floor)}</b></div></div>
<div class="bar"><i style="width:${pct}%;background:${pct>=100?'#3ddc84':'#ffb648'}"></i></div><div class="mut">${pct>=100?'Above floor by '+$(h.banked-h.floor):'Short '+$(h.floor-h.banked)}</div></div>
<div class="card"><div class="mut">Revolving total</div><div class="big" style="color:#ff5d6c">${$(h.revolving)}</div></div>
${att.length?`<h2>⚠️ Needs you / stale</h2>${att.map(c=>`<div class="card ${c.marks.includes('NEED YOU')?'alert':'warnb'}"><b>${esc(c.name)}</b> ${tags(c.marks)}<div class="mut">${esc(c.lines[0]||c.status)}</div></div>`).join('')}`:''}
<h2>Cards · payoff order</h2>${cards.map(c=>cardRow(c,ORDER[c.id]?` <span class="ph">${ORDER[c.id][1]}</span>`:'')).join('')}
<h2>Cash</h2>${by('Cash').map(c=>cardRow(c)).join('')}
<h2>Assets</h2>${by('Assets beyond cash').map(c=>cardRow(c,c.id=='A14'?' <span class="tag hold">HOLD · never sell</span>':'')).join('')}
<h2>Loans</h2>${by('Loans').map(c=>cardRow(c)).join('')}
<h2>Full ledger</h2>${d.sections.map(s=>`<details><summary>${esc(s.title)}</summary><pre>${esc(s.body)}</pre></details>`).join('')}
<details><summary>Recent log</summary><pre>${d.log.map(esc).join('\n\n')}</pre></details>
<button onclick="localStorage.removeItem('midasKey');location.reload()" style="background:#222a3b;color:#e8ecf4">Lock & forget device</button>`}
tryRemembered();
</script></body></html>
